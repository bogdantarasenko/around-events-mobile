name: Around

options:
  bundleIdPrefix: events.around
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"

knownRegions:
  - en
  - uk
  - ru
  - be
  - Base

aggregateTargets:
  AroundKitBuilder:
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        PRODUCT_NAME: $(TARGET_NAME)
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    buildScripts:
      - name: Build AroundKit
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "YES" = "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-}" ]; then
            echo "Skipping Gradle build task (OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES)"
            exit 0
          fi
          # Aggregate targets don't set FRAMEWORKS_FOLDER_PATH; KMP validates it but with isStatic=true the value is unused.
          export FRAMEWORKS_FOLDER_PATH="${FRAMEWORKS_FOLDER_PATH:-Frameworks}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode < /dev/null

targets:
  Around:
    type: application
    platform: iOS
    sources:
      - path: Source
      - path: Resources
      - path: Info.plist
        buildPhase: none
    dependencies:
      - target: AroundKitBuilder
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(AROUND_BUNDLE_ID)
        INFOPLIST_FILE: Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(AROUND_DEVELOPMENT_TEAM)
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - $(inherited)
          - "-framework"
          - AroundKit

schemes:
  Around:
    build:
      targets:
        Around: all
    run:
      config: Debug
    archive:
      config: Release
