#Gradle
org.gradle.jvmargs=-Xms2g -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xms2g -Xmx4g -XX:+UseParallelGC
org.gradle.caching=true

org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#MPP
kotlin.mpp.enableCInteropCommonization=true

kotlin.native.ignoreDisabledTargets=true

# Backend the apps talk to. Point a local build elsewhere with -Paround.baseUrl=http://10.0.2.2:8000
around.baseUrl=https://around.events
